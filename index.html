<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Video</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .video-container {
            position: fixed;
            inset: 0;
            background: #000;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .sound-button {
            position: fixed;
            left: 50%;
            bottom: calc(30px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            z-index: 10;
            padding: 12px 20px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 30px;
            color: #fff;
            background: rgba(0, 0, 0, 0.75);
            font: 600 14px Arial, sans-serif;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .sound-button.hidden {
            display: none;
        }
    </style>
</head>

<body>
    <main class="video-container">
        <video
            id="videoUtama"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        >
            <source src="./video.mp4" type="video/mp4">
        </video>
    </main>

    <button id="tombolSuara" class="sound-button" type="button">
        🔊 Tekan untuk mengaktifkan suara
    </button>

    <script>
        const video = document.getElementById("videoUtama");
        const tombolSuara = document.getElementById("tombolSuara");

        async function putarVideo() {
            video.muted = true;

            try {
                await video.play();
            } catch (error) {
                console.log("Autoplay menunggu interaksi pengguna.");
            }
        }

        async function aktifkanSuara() {
            video.muted = false;
            video.volume = 1;

            try {
                await video.play();
                tombolSuara.classList.add("hidden");
            } catch (error) {
                console.log("Video belum dapat diputar.");
            }
        }

        tombolSuara.addEventListener("click", aktifkanSuara);
        video.addEventListener("click", aktifkanSuara);

        document.addEventListener("DOMContentLoaded", putarVideo);
    </script>
</body>
</html>
