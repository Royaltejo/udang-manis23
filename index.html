<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Video</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .video-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        @media (orientation: landscape) {
            video {
                width: auto;
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="video-container">
        <video
            id="videoUtama"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
            controlslist="nodownload noplaybackrate"
            disablepictureinpicture
        >
            <source src="./video.mp4" type="video/mp4">
        </video>
    </main>

    <script>
        const video = document.getElementById("videoUtama");

        async function mulaiVideo() {
            video.muted = true;

            try {
                await video.play();
            } catch (error) {
                document.addEventListener(
                    "click",
                    () => video.play(),
                    { once: true }
                );
            }
        }

        document.addEventListener("DOMContentLoaded", mulaiVideo);

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                video.pause();
            } else {
                mulaiVideo();
            }
        });
    </script>
</body>
</html>
